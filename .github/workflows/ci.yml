name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devtrace
          POSTGRES_PASSWORD: devtrace
          POSTGRES_DB: devtrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrace"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devtrace:devtrace@localhost:5432/devtrace_test
      TOKEN_ENCRYPTION_KEY: ci-test-encryption-key
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devtrace:ci .
